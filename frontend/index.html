<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Salient Replica — Agent Graph Visualizer</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #0d1117; color: #c9d1d9; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; overflow: hidden; }
        canvas { display: block; cursor: grab; }
        canvas:active { cursor: grabbing; }
        #sidebar { position: fixed; right: 0; top: 0; bottom: 0; width: 380px; background: #161b22; border-left: 1px solid #30363d; overflow-y: auto; padding: 20px; }
        #sidebar h2 { font-size: 14px; color: #58a6ff; margin-bottom: 12px; text-transform: uppercase; letter-spacing: 1px; }
        #sidebar .node-info { margin-bottom: 20px; }
        #sidebar .label { color: #8b949e; font-size: 12px; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 4px; }
        #sidebar .value { font-size: 14px; margin-bottom: 12px; }
        #sidebar .badge { display: inline-block; padding: 2px 8px; border-radius: 12px; font-size: 11px; font-weight: 600; margin-right: 4px; }
        .badge-read { background: #1a7f37; color: #fff; }
        .badge-proposal { background: #fb8500; color: #fff; }
        .badge-execution { background: #cf222e; color: #fff; }
        .badge-routing { background: #8957e5; color: #fff; }
        .badge-gate { background: #1f6feb; color: #fff; }
        #header { position: fixed; top: 0; left: 0; right: 380px; padding: 12px 20px; background: #161b22; border-bottom: 1px solid #30363d; z-index: 10; display: flex; align-items: center; gap: 16px; }
        #header h1 { font-size: 16px; color: #f0f6fc; }
        #header .subtitle { font-size: 12px; color: #8b949e; }
        #legend { position: fixed; bottom: 20px; left: 20px; background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 12px 16px; font-size: 12px; }
        #legend .item { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
        #legend .dot { width: 12px; height: 12px; border-radius: 50%; }
        #controls { position: fixed; bottom: 20px; right: 400px; display: flex; gap: 8px; }
        #controls button { background: #21262d; color: #c9d1d9; border: 1px solid #30363d; border-radius: 6px; padding: 6px 12px; font-size: 12px; cursor: pointer; }
        #controls button:hover { background: #30363d; }
        #simulator { position: fixed; top: 60px; left: 20px; background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 16px; width: 340px; z-index: 5; }
        #simulator h3 { font-size: 13px; color: #58a6ff; margin-bottom: 10px; text-transform: uppercase; }
        #simulator select, #simulator input { background: #0d1117; color: #c9d1d9; border: 1px solid #30363d; border-radius: 4px; padding: 6px 8px; font-size: 13px; width: 100%; margin-bottom: 8px; }
        #simulator label { font-size: 11px; color: #8b949e; text-transform: uppercase; display: block; margin-bottom: 3px; }
        #simulator button { background: #238636; color: #fff; border: none; border-radius: 6px; padding: 8px; font-size: 13px; cursor: pointer; width: 100%; }
        #simulator button:hover { background: #2ea043; }
        #simulator .result { margin-top: 10px; padding: 10px; background: #0d1117; border-radius: 6px; font-size: 12px; display: none; }
        #simulator .result .route { color: #58a6ff; font-weight: 600; }
        #simulator .result .exit { color: #3fb950; }
        #simulator .result .blocked { color: #f85149; }
        .tool-list { list-style: none; }
        .tool-list li { padding: 4px 0; font-size: 13px; }
    </style>
</head>
<body>
    <div id="header">
        <h1>Salient Replica</h1>
        <span class="subtitle">Agent Graph Visualizer — Taylor Agent Core</span>
    </div>

    <canvas id="canvas"></canvas>

    <div id="simulator">
        <h3>Route Simulator</h3>
        <label>Utterance</label>
        <input type="text" id="utterance" placeholder="e.g. I want to pay $300" value="I want to pay $300">
        <label>Channel</label>
        <select id="channel">
            <option value="sms">SMS</option>
            <option value="chat">Chat</option>
            <option value="voice">Voice</option>
        </select>
        <label>Auth Level</label>
        <select id="auth">
            <option value="anonymous">Anonymous</option>
            <option value="verified" selected>Verified</option>
            <option value="step_up">Step-Up</option>
        </select>
        <button id="simulate">Simulate Route</button>
        <div class="result" id="result"></div>
    </div>

    <div id="sidebar">
        <h2>Node Details</h2>
        <div id="node-info">
            <p style="color:#8b949e;font-size:13px;">Click a node to see details.</p>
        </div>
    </div>

    <div id="legend">
        <div class="item"><div class="dot" style="background:#8957e5"></div> Routing / Control</div>
        <div class="item"><div class="dot" style="background:#1a7f37"></div> Read Tool</div>
        <div class="item"><div class="dot" style="background:#fb8500"></div> Proposal Tool</div>
        <div class="item"><div class="dot" style="background:#cf222e"></div> Execution Tool</div>
        <div class="item"><div class="dot" style="background:#1f6feb"></div> Gate</div>
    </div>

    <div id="controls">
        <button id="zoom-in">Zoom +</button>
        <button id="zoom-out">Zoom −</button>
        <button id="reset">Reset View</button>
    </div>

    <script src="src/main.js"></script>
</body>
</html>
