[project]
name = "salient-replica"
version = "0.1.0"
description = "Conversational AI system with deterministic safety boundaries around LLM reasoning"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "langgraph>=0.2.0",
    "langchain-openai>=0.2.0",
    "langchain-core>=0.3.0",
    "pydantic>=2.9.0",
    "sqlalchemy>=2.0.0",
    "asyncpg>=0.30.0",
    "redis>=5.2.0",
    "httpx>=0.28.0",
    "openai>=1.55.0",
    "opentelemetry-api>=1.28.0",
    "opentelemetry-sdk>=1.28.0",
    "opentelemetry-exporter-otlp>=1.28.0",
    "opentelemetry-instrumentation-fastapi>=0.49b0",
    "opentelemetry-instrumentation-httpx>=0.49b0",
    "temporalio>=1.7.0",
    "python-dotenv>=1.0.0",
    "structlog>=24.4.0",
    "greenlet>=3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.28.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
]

[tool.setuptools.packages.find]
include = ["taylor*", "marshall*", "mocks*", "evals*"]
exclude = ["tests*"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
# E501: long lines in tests (URLs, assertion messages) are kept for readability.
# UP042: keep `str, Enum` mixins — `str(member)` returns the bare value, stable
# across Python 3.11/3.12; `enum.StrEnum` changes `str()` semantics in 3.12 and
# would alter serialized state, which is persisted as JSON.
ignore = ["E501", "UP042"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["taylor/tests", "marshall/tests", "evals"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
